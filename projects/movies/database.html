<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Large Dataset Viewer</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; position: sticky; top: 0; }
        tr:nth-child(even) { background: #f2f2f2; }
        
        .pagination { display: flex; gap: 5px; margin-top: 20px; flex-wrap: wrap; }
        .page-btn { 
            padding: 8px 12px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 4px; 
        }
        .page-btn.active { background: #007bff; color: white; border-color: #007bff; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .info { margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Movie Database Viewer</h2>
    <div class="info" id="dataInfo">Loading data...</div>

    <div class="controls">
        <button class="page-btn" id="prevBtn">« Previous</button>
        <div id="pageNumbers" class="pagination"></div>
        <button class="page-btn" id="nextBtn">Next »</button>
    </div>

    <table id="movieTable">
        <thead>
            <tr>
                <th>TMDB ID</th>
                <th>Title</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let allData = [];
        let currentPage = 1;
        const rowsPerPage = 50000; // As requested

        async function init() {
            try {
                const response = await fetch('title-mapping.txt');
                const text = await response.text();
                
                // Parse lines and filter out empty ones
                allData = text.trim().split('\n')
                    .map(line => line.split('*#'))
                    .filter(parts => parts.length === 2);

                renderTable();
                renderPagination();
            } catch (err) {
                document.getElementById('dataInfo').textContent = "Error loading file.";
            }
        }

        function renderTable() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageData = allData.slice(start, end);
            
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = pageData.map(item => `
                <tr>
                    <td>${item[0].trim()}</td>
                    <td>${item[1].trim()}</td>
                </tr>
            `).join('');

            document.getElementById('dataInfo').textContent = 
                `Showing ${start + 1} to ${Math.min(end, allData.length)} of ${allData.length} records`;
        }

        function renderPagination() {
            const pageCount = Math.ceil(allData.length / rowsPerPage);
            const container = document.getElementById('pageNumbers');
            container.innerHTML = '';

            for (let i = 1; i <= pageCount; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.onclick = () => {
                    currentPage = i;
                    updateUI();
                };
                container.appendChild(btn);
            }

            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === pageCount;
        }

        function updateUI() {
            renderTable();
            renderPagination();
            window.scrollTo(0, 0); // Scroll to top when changing page
        }

        document.getElementById('prevBtn').onclick = () => { if(currentPage > 1) { currentPage--; updateUI(); } };
        document.getElementById('nextBtn').onclick = () => { 
            if(currentPage < Math.ceil(allData.length / rowsPerPage)) { currentPage++; updateUI(); } 
        };

        init();
    </script>
</body>
</html>
