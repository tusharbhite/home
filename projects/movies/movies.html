<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Local Media Portal</title>
    <style>
        :root { --accent: #e50914; --bg: #0f0f0f; --card: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #efefef; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 900px; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .search-section { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .input-row { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #2b2b2b; color: white; outline: none; }
        input:focus { border-color: var(--accent); }
        button { padding: 12px 20px; border-radius: 6px; border: none; background: var(--accent); color: white; cursor: pointer; font-weight: bold; }
        
        /* Results List Styling */
        #resultsList { margin-top: 10px; background: #2b2b2b; border-radius: 6px; overflow: hidden; display: none; border: 1px solid #444; }
        .result-item { padding: 12px; border-bottom: 1px solid #444; cursor: pointer; transition: 0.2s; }
        .result-item:hover { background: #3d3d3d; color: var(--accent); }
        .result-item:last-child { border-bottom: none; }

        .video-container { margin-top: 25px; width: 100%; background: #000; border-radius: 8px; overflow: hidden; display: none; aspect-ratio: 16 / 9; }
        .status { font-size: 0.85rem; color: #888; margin-bottom: 5px; }
        .error { color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0">Local Stream Finder</h2>

    <div class="search-section">
        <div class="status">Search by Title:</div>
        <div class="input-row">
            <input type="text" id="titleInput" placeholder="Enter movie title (e.g. Citizen Kane)">
            <button onclick="searchByTitle()">Find Movie</button>
        </div>
        <div id="resultsList"></div>

        <hr style="border: 0; border-top: 1px solid #333; width: 100%;">

        <div class="status">Search by IMDb URL:</div>
        <div class="input-row">
            <input type="text" id="imdbUrl" placeholder="https://www.imdb.com/title/tt0107286/">
            <button onclick="searchByImdb()">Fetch & Play</button>
        </div>
    </div>

    <p id="errorMessage" class="error"></p>

    <div id="playerWrapper" class="video-container">
        <iframe id="videoPlayer" src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
    </div>
</div>

<script>
    const MAPPING_FILE = 'mapping.txt';
    const TITLE_FILE = 'title-mapping.txt';

    const playerWrapper = document.getElementById('playerWrapper');
    const iframe = document.getElementById('videoPlayer');
    const errorEl = document.getElementById('errorMessage');
    const resultsList = document.getElementById('resultsList');

    function showError(msg) {
        errorEl.innerText = msg;
        errorEl.style.display = 'block';
        playerWrapper.style.display = 'none';
    }

    function setPlayer(tmdbId) {
        errorEl.style.display = 'none';
        resultsList.style.display = 'none';
        iframe.src = `https://www.vidking.net/embed/movie/${tmdbId}`;
        playerWrapper.style.display = 'block';
    }

    // --- FEATURE 1: SEARCH BY TITLE ---
    async function searchByTitle() {
        const query = document.getElementById('titleInput').value.toLowerCase().trim();
        if (!query) return;

        try {
            const response = await fetch(TITLE_FILE);
            const text = await response.text();
            const lines = text.split('\n');

            // Find matches (Starts with or exact match preferred, then contains)
            const matches = lines.filter(line => {
                const titlePart = line.split('*#')[1];
                return titlePart && titlePart.toLowerCase().includes(query);
            }).slice(0, 10); // Limit to top 10 results

            if (matches.length > 0) {
                displayResults(matches);
            } else {
                showError("No titles found matching that search.");
            }
        } catch (err) {
            showError("Error loading title-mapping.txt");
        }
    }

    function displayResults(matches) {
        resultsList.innerHTML = '';
        resultsList.style.display = 'block';
        
        matches.forEach(match => {
            const [id, title] = match.split('*#');
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerText = title;
            div.onclick = () => setPlayer(id);
            resultsList.appendChild(div);
        });
    }

    // --- FEATURE 2: SEARCH BY IMDB ---
    async function searchByImdb() {
        const urlInput = document.getElementById('imdbUrl').value;
        const imdbMatch = urlInput.match(/tt\d+/);

        if (!imdbMatch) {
            showError("Invalid IMDb URL.");
            return;
        }

        const targetImdbId = imdbMatch[0];

        try {
            const response = await fetch(MAPPING_FILE);
            const text = await response.text();
            
            // Regex to find the TMDB ID prefixing the specific IMDb ID
            const regex = new RegExp(`(\\d+)${targetImdbId}`, 'g');
            const found = regex.exec(text);

            if (found && found[1]) {
                setPlayer(found[1]);
            } else {
                throw new Error("IMDb ID not found in mapping file.");
            }
        } catch (err) {
            showError(err.message);
        }
    }
</script>

</body>
</html>
