<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Explorer | Pro Search</title>
    <style>
        :root { --accent: #e50914; --bg: #0f0f0f; --card: #1e1e1e; --input: #2b2b2b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #efefef; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 900px; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .section { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .section:last-of-type { border-bottom: none; }
        .label { font-size: 0.85rem; color: #aaa; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        input, select { flex: 1; min-width: 120px; padding: 12px; border-radius: 6px; border: 1px solid #333; background: var(--input); color: white; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        .short-input { flex: 0 0 80px; }
        button { padding: 12px 20px; border-radius: 6px; border: none; background: var(--accent); color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #ff1e27; }
        
        /* Server Selection Styling */
        .server-header { display: flex; justify-content: space-between; align-items: center; background: #252525; padding: 10px 15px; border-radius: 8px 8px 0 0; border: 1px solid #333; margin-top: 25px; display: none; }
        .server-header.active { display: flex; }
        .server-label { font-size: 0.8rem; font-weight: bold; color: var(--accent); }
        #serverSelect { flex: none; width: 180px; padding: 5px; font-size: 0.8rem; background: #111; }

        .api-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
        .poster-card { background: #111; border-radius: 6px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #333; position: relative; }
        .poster-card:hover { transform: scale(1.05); border-color: var(--accent); }
        .poster-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .poster-info { padding: 8px; font-size: 0.75rem; text-align: center; }
        .badge { position: absolute; top: 5px; right: 5px; background: var(--accent); font-size: 10px; padding: 2px 5px; border-radius: 3px; font-weight: bold; }

        #resultsList { background: var(--input); border-radius: 6px; overflow: hidden; display: none; border: 1px solid #444; max-height: 250px; overflow-y: auto; margin-bottom: 15px; }
        .result-item { padding: 12px; border-bottom: 1px solid #444; cursor: pointer; }
        .result-item:hover { background: #3d3d3d; color: var(--accent); }

        .video-container { width: 100%; background: #000; border-radius: 0 0 8px 8px; overflow: hidden; display: none; aspect-ratio: 16 / 9; border: 1px solid #333; }
        .error { color: #ff4d4d; font-size: 0.9rem; margin-top: 10px; display: none; background: rgba(255, 77, 77, 0.1); padding: 10px; border-radius: 5px; }
        .loader { color: var(--accent); font-size: 0.8rem; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0; color: var(--accent);">Media Explorer</h2>

    <div id="fileStatus" class="loader">Processing request...</div>

    <div class="section" style="background: rgba(229, 9, 20, 0.05); padding: 15px; border-radius: 8px;">
        <div class="label" style="color: var(--accent);">Search Online (Auto-Find ID)</div>
        <div class="input-row">
            <input type="text" id="apiSearchInput" placeholder="Enter movie or series name (e.g. Inception, Stranger Things)...">
            <button onclick="searchOnline()">Search Online</button>
        </div>
        <div id="apiResults" class="api-results"></div>
    </div>

    <div class="section">
        <div class="label">1. Search Local Database by Title</div>
        <div class="input-row">
            <input type="text" id="titleInput" placeholder="Enter movie title...">
            <button onclick="searchByTitle()">Find Title</button>
        </div>
        <div id="resultsList"></div>
    </div>

    <div class="section">
        <div class="label">2. Search Movie by IMDb URL</div>
        <div class="input-row">
            <input type="text" id="imdbUrl" placeholder="https://www.imdb.com/title/tt...">
            <button onclick="searchByImdb()">Scan Mapping</button>
        </div>
    </div>

    <div class="section">
        <div class="label">3. Direct Movie TMDB ID</div>
        <div class="input-row">
            <input type="text" id="tmdbInput" placeholder="Enter ID (e.g. 278)">
            <button onclick="searchByTmdb()">Play Movie</button>
        </div>
    </div>

    <div class="section">
        <div class="label">4. Web Series (TMDB ID + S/E)</div>
        <div class="input-row">
            <input type="text" id="seriesId" placeholder="TMDB URL or Series ID (e.g. 119051)">
            <input type="number" id="seasonNum" class="short-input" placeholder="S" value="1">
            <input type="number" id="episodeNum" class="short-input" placeholder="E" value="1">
            <button onclick="searchSeries()">Play Series</button>
        </div>
    </div>

    <p id="errorMessage" class="error"></p>

    <div id="serverHeader" class="server-header">
        <div class="server-label">STREAMING SOURCE</div>
        <select id="serverSelect" onchange="updateServer()">
            <option value="vidking">Vidking (Default)</option>
            <option value="1">Server 1 (Rakan)</option>
            <option value="2">Server 2 (Bard)</option>
            <option value="3">Server 3 (Xayah)</option>
            <option value="4">Server 4 (Ekko)</option>
            <option value="5">Server 5 (Naafiri)</option>
            <option value="6">Server 6 (Ryze)</option>
        </select>
    </div>

    <div id="playerWrapper" class="video-container">
        <iframe id="videoPlayer" src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
    </div>
</div>

<script>
    const MAPPING_FILE = '/home/projects/movies/mapping.txt';
    const TITLE_FILE = '/home/projects/movies/title-mapping.txt';
    const DEPLOY_URL = "https://script.google.com/macros/s/AKfycbzwCBrQEre003L4PuM9_2sU6moQB7iv1pCafP6FG6VG95qv-Decngx5igUuFSM-hLjKqw/exec";
    
    let currentState = { id: '', type: 'movie', season: 1, episode: 1 };

    const playerWrapper = document.getElementById('playerWrapper');
    const iframe = document.getElementById('videoPlayer');
    const errorEl = document.getElementById('errorMessage');
    const resultsList = document.getElementById('resultsList');
    const statusEl = document.getElementById('fileStatus');
    const apiResultsGrid = document.getElementById('apiResults');
    const serverHeader = document.getElementById('serverHeader');
    const serverSelect = document.getElementById('serverSelect');

    function updateServer() {
        if (currentState.id) {
            setPlayer(currentState.id, currentState.type, currentState.season, currentState.episode);
        }
    }

    function setPlayer(id, type = 'movie', season = 1, episode = 1) {
        currentState = { id, type, season, episode };
        errorEl.style.display = 'none';
        resultsList.style.display = 'none';
        
        let selectedServer = serverSelect.value;
        let src = '';

        // Handle Sandbox Attribute logic
        if (selectedServer === 'vidking' || selectedServer === '1') {
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
        } else {
            iframe.removeAttribute('sandbox');
        }

        if (selectedServer === 'vidking') {
            src = (type === 'tv') 
                ? `https://www.vidking.net/embed/tv/${id}/${season}/${episode}?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`
                : `https://www.vidking.net/embed/movie/${id}`;
        } else {
            const sNum = parseInt(selectedServer);
            if (type === 'movie') {
                switch (sNum) {
                    case 1: src = `https://vidsrc.cc/v3/embed/movie/${id}?autoPlay=false`; break;
                    case 2: src = `https://moviesapi.club/movie/${id}`; break;
                    case 3: src = `https://vidsrc.me/embed/movie?tmdb=${id}`; break;
                    case 4: src = `https://player.videasy.net/movie/${id}`; break;
                    case 5: src = `https://vidsrc.su/embed/movie/${id}`; break;
                    case 6: src = `https://vidlink.pro/movie/${id}?title=true&poster=true&autoplay=false`; break;
                }
            } else {
                switch (sNum) {
                    case 1: src = `https://vidsrc.cc/v3/embed/tv/${id}/${season}/${episode}?autoPlay=false`; break;
                    case 2: src = `https://moviesapi.club/tv/${id}-${season}-${episode}`; break;
                    case 3: src = `https://vidsrc.me/embed/tv?tmdb=${id}&season=${season}&episode=${episode}`; break;
                    case 4: src = `https://player.videasy.net/tv/${id}/${season}/${episode}?nextEpisode=true&episodeSelector=true`; break;
                    case 5: src = `https://vidsrc.su/embed/tv/${id}/${season}/${episode}`; break;
                    case 6: src = `https://vidlink.pro/tv/${id}/${season}/${episode}?title=true&poster=true&autoplay=false&nextbutton=true`; break;
                }
            }
        }
        
        iframe.src = src;
        serverHeader.classList.add('active');
        playerWrapper.style.display = 'block';
        playerWrapper.scrollIntoView({ behavior: 'smooth' });
    }

    async function searchOnline() {
        const query = document.getElementById('apiSearchInput').value.trim();
        if (!query) return;
        statusEl.style.display = 'block';
        apiResultsGrid.innerHTML = '';
        errorEl.style.display = 'none';
        try {
            const response = await fetch(`${DEPLOY_URL}?search=${encodeURIComponent(query)}`);
            const data = await response.json();
            statusEl.style.display = 'none';
            if (data.error) throw new Error(data.error);
            const allItems = [...(data.movies || []), ...(data.series || [])];
            if (allItems.length === 0) { showError("No online results found."); return; }
            allItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'poster-card';
                card.innerHTML = `
                    <span class="badge">${item.type.toUpperCase()}</span>
                    <img src="${item.poster || 'https://via.placeholder.com/200x300?text=No+Poster'}" alt="${item.title}">
                    <div class="poster-info"><strong>${item.title}</strong><br><span style="color:#888">${item.date.split('-')[0]}</span></div>`;
                card.onclick = () => item.type === 'movie' ? setPlayer(item.id, 'movie') : setPlayer(item.id, 'tv', 1, 1);
                apiResultsGrid.appendChild(card);
            });
        } catch (err) { statusEl.style.display = 'none'; showError("API Error: " + err.message); }
    }

    function showError(msg) {
        errorEl.innerText = msg;
        errorEl.style.display = 'block';
        playerWrapper.style.display = 'none';
        serverHeader.classList.remove('active');
        statusEl.style.display = 'none';
    }

    async function searchByTitle() {
        const query = document.getElementById('titleInput').value.toLowerCase().trim();
        if (!query) return;
        statusEl.style.display = 'block';
        try {
            const response = await fetch(TITLE_FILE);
            const text = await response.text();
            const lines = text.split('\n');
            const matches = lines.filter(line => {
                const titlePart = line.split('*#')[1];
                return titlePart && titlePart.toLowerCase().includes(query);
            }).slice(0, 10);
            statusEl.style.display = 'none';
            if (matches.length > 0) {
                resultsList.innerHTML = '';
                resultsList.style.display = 'block';
                matches.forEach(match => {
                    const [id, title] = match.split('*#');
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerText = title;
                    div.onclick = () => setPlayer(id.trim(), 'movie');
                    resultsList.appendChild(div);
                });
            } else { showError("No title matches found."); }
        } catch (err) { showError("Could not load mapping files."); }
    }

    async function searchByImdb() {
        const urlInput = document.getElementById('imdbUrl').value;
        const imdbMatch = urlInput.match(/tt\d+/);
        if (!imdbMatch) { showError("Invalid IMDb URL format."); return; }
        statusEl.style.display = 'block';
        try {
            const response = await fetch(MAPPING_FILE);
            const text = await response.text();
            const regex = new RegExp(`(\\d+)${imdbMatch[0]}`, 'g');
            const found = regex.exec(text);
            statusEl.style.display = 'none';
            if (found && found[1]) { setPlayer(found[1], 'movie'); } 
            else { showError("IMDb ID not found."); }
        } catch (err) { showError("Error reading mapping file."); }
    }

    function searchByTmdb() {
        const input = document.getElementById('tmdbInput').value.trim();
        const match = input.match(/\d+/);
        if (match) setPlayer(match[0], 'movie');
        else showError("Invalid TMDB ID.");
    }

    function searchSeries() {
        const inputVal = document.getElementById('seriesId').value.trim();
        const season = document.getElementById('seasonNum').value || 1;
        const episode = document.getElementById('episodeNum').value || 1;
        const idMatch = inputVal.match(/(?:movie|tv)\/(\d+)|^\d+$/);
        const finalId = idMatch ? (idMatch[1] || idMatch[0]) : null;
        if (finalId) setPlayer(finalId, 'tv', season, episode);
        else showError("Invalid ID or URL.");
    }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('tmdbid');
        if (tmdbId && /^\d+$/.test(tmdbId)) setPlayer(tmdbId, 'movie');
    };
</script>
</body>
</html>
