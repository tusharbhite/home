<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Explorer Pro</title>
    <style>
        :root { --accent: #e50914; --bg: #0b0b0b; --card: #181818; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }

        /* --- NAVIGATION --- */
        nav { 
            position: fixed; top: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.95); 
            display: flex; align-items: center; justify-content: space-between; padding: 0 4%; 
            z-index: 1000; box-sizing: border-box; border-bottom: 1px solid #333;
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .nav-links button { 
            background: none; border: none; color: #aaa; font-size: 1rem; 
            margin: 0 10px; cursor: pointer; transition: 0.3s; font-weight: 500;
        }
        .nav-links button:hover, .nav-links button.active { color: var(--accent); }

        /* --- SIDEBAR --- */
        #sidebar {
            position: fixed; right: -420px; top: 0; width: 400px; height: 100%;
            background: #141414; z-index: 2000; transition: 0.4s;
            padding: 30px; box-shadow: -10px 0 30px rgba(0,0,0,0.7); overflow-y: auto; box-sizing: border-box;
        }
        #sidebar.open { right: 0; }
        .close-sidebar { float: right; cursor: pointer; font-size: 2rem; color: #888; }

        /* --- MAIN CONTENT --- */
        .container { padding: 90px 4% 50px; }
        
        .search-container { max-width: 600px; margin: 0 auto 30px; }
        .main-search { 
            width: 100%; padding: 15px 25px; border-radius: 30px; 
            background: #222; border: 1px solid #444; color: white; font-size: 1rem; outline: none;
        }

        .filter-row { margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: center; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 0.7rem; color: #888; text-transform: uppercase; font-weight: bold; }
        select, input[type="number"] { background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 6px; outline: none; }

        /* --- PLAYER --- */
        #player-wrapper { 
            display: none; width: 100%; max-width: 1100px; margin: 0 auto 40px; 
            background: #000; border: 1px solid #333; border-radius: 8px; overflow: hidden;
        }
        .player-header { background:#1a1a1a; padding:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px;}
        .close-player { background: #333; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
        .video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* --- GRID --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 25px; }
        .card { background: var(--card); border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #222; }
        .card:hover { transform: translateY(-8px); border-color: var(--accent); }
        .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 12px; font-size: 0.85rem; text-align: center; font-weight: 500; }

        /* --- PAGINATION --- */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 50px; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #444; }
        .loader { text-align: center; padding: 50px; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <div class="logo">STREAM<span>PRO</span></div>
    <div class="nav-links">
        <button class="active" onclick="setLang('hi-IN', this)">Hindi</button>
        <button onclick="setLang('en-US', this)">English</button>
        <button onclick="setLang('mr-IN', this)">Marathi</button>
    </div>
    <div style="color:var(--accent); cursor:pointer;" onclick="toggleSidebar()">ID 🔑</div>
</nav>

<div id="sidebar">
    <span class="close-sidebar" onclick="toggleSidebar()">×</span>
    <h2 style="color: var(--accent); margin-top: 0;">Manual Play</h2>
    <div class="filter-group">
        <label>TMDB ID</label>
        <input type="text" id="tmdbInput" placeholder="e.g. 278" style="padding:10px; background:#222; border:1px solid #444; color:white;">
        <button class="btn" style="margin-top:10px;" onclick="playById()">Play ID</button>
    </div>
</div>

<div class="container">
    <div class="search-container">
        <input type="search" id="mainSearchInput" class="main-search" placeholder="Search movies or series..." onsearch="handleSearch(this.value)" onkeyup="if(event.key==='Enter') handleSearch(this.value)">
    </div>

    <div id="player-wrapper">
        <div class="player-header">
            <span id="playing-title" style="color:var(--accent); font-weight:bold; font-size:0.9rem; flex:1;">Streaming</span>
            
            <div id="tv-controls" style="display:none; gap:10px; align-items:center; margin-right:15px;">
                <input type="number" id="seasonNum" value="1" min="1" style="width:50px;" onchange="updateServer()">
                <label style="font-size:0.7rem">S</label>
                <input type="number" id="episodeNum" value="1" min="1" style="width:50px;" onchange="updateServer()">
                <label style="font-size:0.7rem">E</label>
            </div>

            <div style="display:flex; gap:10px;">
                <select id="serverSelect" onchange="updateServer()">
                    <option value="vidking">Vidking (Main)</option>
                    <option value="1">Server 1 (Vidsrc CC)</option>
                    <option value="2">Server 2 (MoviesApi)</option>
                    <option value="3">Server 3 (Vidsrc Me)</option>
                    <option value="4">Server 4 (Videasy)</option>
                    <option value="5">Server 5 (Vidsrc Su)</option>
                    <option value="6">Server 6 (Vidlink Pro)</option>
                </select>
                <button class="close-player" onclick="closePlayer()">✕</button>
            </div>
        </div>
        <div class="video-container"><iframe id="mainPlayer" src="" frameborder="0" allowfullscreen></iframe></div>
    </div>

    <div class="filter-row" id="filterRow">
        <div class="filter-group">
            <label>Category</label>
            <select id="typeFilter" onchange="resetAndLoad()">
                <option value="movie">Movies</option>
                <option value="tv">TV Shows</option>
            </select>
        </div>
        <div class="filter-group" style="display: none;">
            <label>Year</label>
            <select id="yearFilter" onchange="resetAndLoad()"></select>
        </div>
        <div class="filter-group">
            <label>Genre</label>
            <select id="genreFilter" onchange="resetAndLoad()">
                <option value="">All Genres</option>
                <option value="28">Action</option>
                <option value="35">Comedy</option>
                <option value="18">Drama</option>
                <option value="10749">Romance</option>
            </select>
        </div>
    </div>

    <div id="mainGrid" class="grid"></div>

    <div class="pagination" id="pagination">
        <button class="btn" id="prevBtn" onclick="changePage(-1)">Previous</button>
        <span id="pageNumber">Page 1</span>
        <button class="btn" onclick="changePage(1)">Next</button>
    </div>
</div>

<script>
    const DEPLOY_URL = "https://script.google.com/macros/s/AKfycbxkExpoUtv9SEzVF6Ph8dz9V0ARkpRLtbSXyMlDz2UZtbGeMKyiHaI8fYv_YU2ppxf4mg/exec";
    
    let currentLang = 'hi-IN';
    let currentPage = 1;
    let currentActiveId = '';
    let currentActiveType = 'movie';
    let isSearchMode = false;

    function initYearFilter() {
        const yearSelect = document.getElementById('yearFilter');
        const currentYear = new Date().getFullYear();
        for (let y = currentYear; y >= 1990; y--) {
            let opt = document.createElement('option');
            opt.value = y; opt.innerHTML = y;
            yearSelect.appendChild(opt);
        }
        yearSelect.value = currentYear;
    }

    async function handleSearch(val) {
        if (!val || val.trim() === "") {
            isSearchMode = false;
            resetAndLoad();
            return;
        }
        isSearchMode = true;
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = `<div class="loader">Searching for "${val}"...</div>`;
        try {
            const type = document.getElementById('typeFilter').value;
            const resp = await fetch(`${DEPLOY_URL}?search=${encodeURIComponent(val)}&type=${type}`);
            const data = await resp.json();
            renderResults(data.results, type);
            document.getElementById('pagination').style.display = 'none';
        } catch (e) { grid.innerHTML = 'Search error.'; }
    }

    async function loadMainGrid() {
        if(isSearchMode) return;
        const grid = document.getElementById('mainGrid');
        const type = document.getElementById('typeFilter').value;
        const year = document.getElementById('yearFilter').value;
        const genre = document.getElementById('genreFilter').value;
        document.getElementById('pagination').style.display = 'flex';
        grid.innerHTML = `<div class="loader">Loading ${year}...</div>`;
        try {
            const url = `${DEPLOY_URL}?lang=${currentLang}&type=${type}&year=${year}&genre=${genre}&page=${currentPage}`;
            const response = await fetch(url);
            const data = await response.json();
            renderResults(data.results, type);
            document.getElementById('pageNumber').innerText = `Page ${currentPage}`;
            document.getElementById('prevBtn').disabled = (currentPage === 1);
        } catch (e) { grid.innerHTML = 'Fetch error.'; }
    }

    function renderResults(results, type) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';
        const valid = results.filter(item => item.poster_path);
        if (valid.length === 0) { grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center;">No content found.</p>`; return; }
        valid.forEach(item => {
            const title = item.title || item.name;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<img src="https://image.tmdb.org/t/p/w500${item.poster_path}"><div class="card-info"><strong>${title}</strong></div>`;
            card.onclick = () => playMedia(item.id, type, title);
            grid.appendChild(card);
        });
    }

    function playMedia(id, type, title) {
        currentActiveId = id;
        currentActiveType = type;
        document.getElementById('playing-title').innerText = title;
        document.getElementById('player-wrapper').style.display = 'block';
        document.getElementById('tv-controls').style.display = (type === 'tv') ? 'flex' : 'none';
        updateServer();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateServer() {
        const selectedServer = document.getElementById('serverSelect').value;
        const iframe = document.getElementById('mainPlayer');
        const season = document.getElementById('seasonNum').value;
        const episode = document.getElementById('episodeNum').value;
        const id = currentActiveId;
        const type = currentActiveType;
        let src = "";

        // Handle Sandbox Attribute logic
        if (selectedServer === 'vidking' || selectedServer === '1') {
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
        } else {
            iframe.removeAttribute('sandbox');
        }

        if (selectedServer === 'vidking') {
            src = (type === 'tv') 
                ? `https://www.vidking.net/embed/tv/${id}/${season}/${episode}?color=e50914&autoPlay=true&nextEpisode=true&episodeSelector=true`
                : `https://www.vidking.net/embed/movie/${id}`;
        } else {
            const sNum = parseInt(selectedServer);
            if (type === 'movie') {
                switch (sNum) {
                    case 1: src = `https://vidsrc.cc/v3/embed/movie/${id}?autoPlay=false`; break;
                    case 2: src = `https://moviesapi.club/movie/${id}`; break;
                    case 3: src = `https://vidsrc.me/embed/movie?tmdb=${id}`; break;
                    case 4: src = `https://player.videasy.net/movie/${id}`; break;
                    case 5: src = `https://vidsrc.su/embed/movie/${id}`; break;
                    case 6: src = `https://vidlink.pro/movie/${id}?title=true&poster=true&autoplay=false`; break;
                }
            } else {
                switch (sNum) {
                    case 1: src = `https://vidsrc.cc/v3/embed/tv/${id}/${season}/${episode}?autoPlay=false`; break;
                    case 2: src = `https://moviesapi.club/tv/${id}-${season}-${episode}`; break;
                    case 3: src = `https://vidsrc.me/embed/tv?tmdb=${id}&season=${season}&episode=${episode}`; break;
                    case 4: src = `https://player.videasy.net/tv/${id}/${season}/${episode}?nextEpisode=true&episodeSelector=true`; break;
                    case 5: src = `https://vidsrc.su/embed/tv/${id}/${season}/${episode}`; break;
                    case 6: src = `https://vidlink.pro/tv/${id}/${season}/${episode}?title=true&poster=true&autoplay=false&nextbutton=true`; break;
                }
            }
        }
        iframe.src = src;
    }

    function closePlayer() {
        document.getElementById('player-wrapper').style.display = 'none';
        document.getElementById('mainPlayer').src = '';
    }

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    function setLang(lang, btn) {
        currentLang = lang;
        isSearchMode = false;
        document.getElementById('mainSearchInput').value = '';
        document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        resetAndLoad();
    }
    function resetAndLoad() { currentPage = 1; loadMainGrid(); }
    function changePage(dir) { currentPage += dir; loadMainGrid(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    function playById() {
        const id = document.getElementById('tmdbInput').value;
        if(id) { playMedia(id, 'movie', 'ID: ' + id); toggleSidebar(); }
    }

    window.onload = () => { initYearFilter(); loadMainGrid(); };
</script>
</body>
</html>
