<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Finder | TMDB Search</title>
    <style>
        :root {
            --accent: #e50914;
            --bg: #0f0f0f;
            --card: #1e1e1e;
            --text: #ffffff;
            --text-dim: #aaa;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        button {
            padding: 12px 25px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background: #ff1e27; }

        .section-title {
            border-left: 4px solid var(--accent);
            padding-left: 10px;
            margin: 30px 0 15px 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
            border: 1px solid #333;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #252525;
        }

        .card-info {
            padding: 12px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-date {
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: var(--accent);
        }

        #errorMessage {
            color: #ff4d4d;
            text-align: center;
            display: none;
        }

        .no-poster {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 270px;
            background: #252525;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: var(--accent); text-align: center;">Media Explorer Search</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search for movies or web series (e.g. Avengers, Dark, Batman)...">
        <button onclick="performSearch()">SEARCH</button>
    </div>

    <div id="loader" class="loader">Searching TMDB Database...</div>
    <div id="errorMessage"></div>

    <div id="movieSection" style="display: none;">
        <h2 class="section-title">Movies</h2>
        <div id="movieResults" class="results-grid"></div>
    </div>

    <div id="seriesSection" style="display: none;">
        <h2 class="section-title">Web Series</h2>
        <div id="seriesResults" class="results-grid"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzwCBrQEre003L4PuM9_2sU6moQB7iv1pCafP6FG6VG95qv-Decngx5igUuFSM-hLjKqw/exec";

    // Allow pressing "Enter" to search
    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') performSearch();
    });

    async function performSearch() {
        const query = document.getElementById('searchInput').value.trim();
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMessage');
        const movieSection = document.getElementById('movieSection');
        const seriesSection = document.getElementById('seriesSection');

        if (!query) return;

        // Reset UI
        loader.style.display = 'block';
        errorMsg.style.display = 'none';
        movieSection.style.display = 'none';
        seriesSection.style.display = 'none';

        try {
            const response = await fetch(`${API_URL}?search=${encodeURIComponent(query)}`);
            const data = await response.json();

            loader.style.display = 'none';

            if (data.error) {
                errorMsg.innerText = "Error: " + data.error;
                errorMsg.style.display = 'block';
                return;
            }

            // Display Movies
            if (data.movies && data.movies.length > 0) {
                displayResults(data.movies, 'movieResults');
                movieSection.style.display = 'block';
            }

            // Display Series
            if (data.series && data.series.length > 0) {
                displayResults(data.series, 'seriesResults');
                seriesSection.style.display = 'block';
            }

            if (data.total_found === 0) {
                errorMsg.innerText = "No results found for '" + query + "'";
                errorMsg.style.display = 'block';
            }

        } catch (err) {
            loader.style.display = 'none';
            errorMsg.innerText = "Failed to reach API. Check your internet or Google Script deployment.";
            errorMsg.style.display = 'block';
            console.error(err);
        }
    }

    function displayResults(items, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Handle missing posters
            const posterHtml = item.poster 
                ? `<img src="${item.poster}" alt="${item.title}" loading="lazy">` 
                : `<div class="no-poster">No Poster Available</div>`;

            card.innerHTML = `
                ${posterHtml}
                <div class="card-info">
                    <div class="card-title" title="${item.title}">${item.title}</div>
                    <div class="card-date">${item.date.split('-')[0]} • ID: ${item.id}</div>
                </div>
            `;

            // On click, you can make this call your setPlayer function from your other code
            card.onclick = () => {
                alert(`Selected ${item.type}: ${item.title} (ID: ${item.id})\n\nYou can now link this to your player code.`);
            };

            container.appendChild(card);
        });
    }
</script>

</body>
</html>
